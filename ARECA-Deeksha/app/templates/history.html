<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Areca - Scan History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Diagnostic History</h2>
        <a href="/" class="btn btn-secondary mb-3">Back to Scanner</a>
        <table class="table table-striped table-bordered bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Disease Detected</th>
                    <th>Confidence</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
                {% for scan in scans %}
                <tr>
                    <td>{{ scan.id }}</td>
                    <td><img src="{{ url_for('static', filename=scan.image_path) }}" width="60" class="img-thumbnail"></td>
                    <td>{{ scan.disease_name }}</td>
                    <td>{{ "%.2f"|format(scan.confidence_score) }}%</td>
                    <td>{{ scan.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No past scans recorded yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
