<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areca - Diagnostic Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 10px 20px;
        }
        .navbar-brand {
            font-weight: bold;
            color: #198754 !important;
            font-size: 24px;
        }
        .profile-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }
        .upload-card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            padding: 30px;
            margin-top: 30px;
            position: relative;
        }
        .dropzone-area {
            border: 2px dashed #198754;
            border-radius: 8px;
            background-color: #f8fff9;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .dropzone-area:hover {
            border-color: #146c43;
            background-color: #f1fbf3;
        }
        #previewImage {
            max-height: 200px;
            display: none;
            border-radius: 6px;
        }
        #loadingOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/dashboard">
                <i class="fas fa-leaf me-2 text-success"></i> Areca
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/history" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-history me-1"></i> History
                </a>
                <div class="profile-icon">
                    <i class="fas fa-user"></i>
                </div>
                <a href="/" class="btn btn-outline-danger btn-sm">Sign Out</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <div class="upload-card text-center shadow-sm">
                    
                    <!-- Loading Spinner Overlay -->
                    <div id="loadingOverlay">
                        <div class="spinner-border text-success mb-3" style="width: 3rem; height: 3rem;" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <h5 class="fw-bold text-dark m-0">Analyzing Tender Arecanut...</h5>
                        <p class="text-muted small mt-1">Running deep learning classification & Grad-CAM visualizer</p>
                    </div>

                    <h3 class="fw-bold mb-1">Arecanut Fruit Disease Diagnosis</h3>
                    <p class="text-muted small mb-4">Upload a clear photo of a young green tender arecanut.</p>
                    
                    <form action="/result" method="GET" id="uploadForm" onsubmit="showLoadingState(event)">
                        <input type="file" id="fileInput" name="fruit_image" accept="image/*" style="display: none;" onchange="previewSelectedImage(event)" required>
                        
                        <div class="dropzone-area" onclick="document.getElementById('fileInput').click()">
                            <div id="dropzonePrompt">
                                <i class="fas fa-cloud-upload-alt fa-3x text-success mb-2"></i>
                                <p class="m-0 fw-bold text-dark">Click or Drag & Drop photo here</p>
                                <span class="text-muted small">PNG, JPG, or JPEG</span>
                            </div>
                            <img id="previewImage" alt="Uploaded Arecanut Preview">
                        </div>

                        <div class="d-flex justify-content-center gap-3">
                            <button type="submit" class="btn btn-success px-4 py-2" id="analyzeBtn">
                                <i class="fas fa-search me-1"></i> Analyze Fruit
                            </button>
                            <button type="button" class="btn btn-light border px-4 py-2" onclick="resetImage()">Reset</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script>
        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('previewImage');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('dropzonePrompt').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function resetImage() {
            document.getElementById('fileInput').value = '';
            document.getElementById('previewImage').style.display = 'none';
            document.getElementById('dropzonePrompt').style.display = 'block';
        }

        function showLoadingState(event) {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
