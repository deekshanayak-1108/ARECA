<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areca - Sign In / Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            padding: 35px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }
        .brand-title {
            font-weight: bold;
            color: #198754;
            font-size: 28px;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .nav-pills .nav-link.active {
            background-color: #198754;
        }
        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 500;
        }
        .btn-green {
            background-color: #198754;
            color: #ffffff;
            border: none;
        }
        .btn-green:hover {
            background-color: #157347;
            color: #ffffff;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #adb5bd;
            font-size: 13px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="d-flex justify-content-center align-items-center mb-2">
            <i class="fas fa-leaf text-success fa-2x me-2"></i>
            <span class="brand-title m-0">Areca</span>
        </div>
        <p class="brand-subtitle">Tender Arecanut Disease Detection</p>

        <!-- Tab Controls -->
        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="signin-tab" data-bs-toggle="pill" data-bs-target="#signin-pane" type="button" role="tab">Sign In</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-pane" type="button" role="tab">Sign Up</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            
            <!-- SIGN IN TAB -->
            <div class="tab-pane fade show active" id="signin-pane" role="tabpanel">
                <form action="/dashboard" method="GET">
                    <div class="mb-3">
                        <label for="signinEmail" class="form-label small fw-bold text-secondary">Email address</label>
                        <input type="email" class="form-control" id="signinEmail" required placeholder="name@example.com">
                    </div>
                    
                    <div class="mb-4">
                        <label for="signinPassword" class="form-label small fw-bold text-secondary">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="signinPassword" required placeholder="••••••••">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('signinPassword', 'toggleIcon1')">
                                <i class="fas fa-eye" id="toggleIcon1"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-green w-100 py-2 mb-3 fw-bold">Sign In</button>
                </form>
            </div>

            <!-- SIGN UP TAB -->
            <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                <form action="/dashboard" method="GET">
                    <div class="mb-3">
                        <label for="signupName" class="form-label small fw-bold text-secondary">Full Name</label>
                        <input type="text" class="form-control" id="signupName" required placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label for="signupEmail" class="form-label small fw-bold text-secondary">Email address</label>
                        <input type="email" class="form-control" id="signupEmail" required placeholder="name@example.com">
                    </div>
                    
                    <div class="mb-4">
                        <label for="signupPassword" class="form-label small fw-bold text-secondary">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="signupPassword" required placeholder="Create password">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('signupPassword', 'toggleIcon2')">
                                <i class="fas fa-eye" id="toggleIcon2"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-green w-100 py-2 mb-3 fw-bold">Create Account</button>
                </form>
            </div>

        </div>

        <div class="divider">OR</div>

        <!-- Google OAuth Button -->
        <a href="/dashboard" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 text-decoration-none">
            <i class="fab fa-google text-danger"></i> Continue with Google
        </a>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const pwdInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
